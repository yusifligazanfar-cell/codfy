<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Talk - Codfy</title>
    <!-- Şrift: Outfit (Müasir və təmiz) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-color: #3b82f6; 
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            padding: 4rem 2rem;
            gap: 5rem;
        }

        /* Sol tərəf: Məlumatlar */
        .contact-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contact-header h1 {
            font-size: 5rem;
            font-weight: 700;
            margin: 0 0 1.5rem 0;
            line-height: 1;
            letter-spacing: -2px;
        }

        .contact-header p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 90%;
            margin: 0;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            margin-top: 4rem;
        }

        .detail-block h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin: 0 0 0.5rem 0;
            font-weight: 500;
        }

        .detail-block p, .detail-block a {
            font-size: 1.2rem;
            color: var(--text-primary);
            text-decoration: none;
            margin: 0 0 0.2rem 0;
            font-weight: 400;
            transition: color 0.3s ease;
            display: block;
        }

        .detail-block a:hover {
            color: var(--accent-color);
        }

        /* Sağ tərəf: Forma */
        .contact-form {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-primary);
            cursor: pointer;
        }

        .form-group label span {
            color: var(--text-secondary);
            margin-right: 1rem;
            font-size: 1rem;
        }

        .form-group input,
        .form-group textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom-color: var(--text-primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Düymə */
        .submit-btn {
            align-self: flex-start;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 1.2rem 3rem;
            font-family: 'Outfit', sans-serif; 
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        /* Mobil uyğunlaşma */
        @media (max-width: 900px) {
            .contact-container {
                flex-direction: column;
                gap: 4rem;
            }
            .contact-header h1 {
                font-size: 3.5rem;
            }
            .contact-details {
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>

<div class="contact-container">
    <div class="contact-info">
        <div class="contact-header">
            <h1>LET'S TALK.</h1>
            <p>We are always looking for new challenges and interesting partners. Also, we love to say hello.</p>
        </div>

        <div class="contact-details">
            <div class="detail-block">
                <h3>Email</h3>
                <a href="mailto:hello@codfy.tech">hello@codfy.tech</a>
            </div>
            <div class="detail-block">
                <h3>Headquarters</h3>
                <p>Baku, Azerbaijan</p>
                <p>Global Operations</p>
            </div>
        </div>
    </div>

    <form class="contact-form" action="#" method="POST">
        <div class="form-group">
            <label for="name"><span>01.</span> What's your name?</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="contact"><span>02.</span> Where can we reach you?</label>
            <input type="text" id="contact" name="contact" placeholder="Email or Phone Number" required>
        </div>

        <div class="form-group">
            <label for="service"><span>03.</span> What are you looking for?</label>
            <input type="text" id="service" name="service" placeholder="Web Design, App Development, vs." required>
        </div>

        <div class="form-group">
            <label for="project"><span>04.</span> Tell us about your project</label>
            <textarea id="project" name="project" placeholder="Məlumat daxil edin..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>

</body>
</html>
